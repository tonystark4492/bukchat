<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<title>BUKCHAT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0b0b; --panel:#161616; --panel2:#1f1f1f; --line:#2a2a2a;
    --orange:#FF7A00; --orange2:#ff9a3c; --white:#ffffff; --muted:#9a9a9a; --danger:#ff4d4d; --ok:#3ddc84;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--white);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .screen.active{display:flex}
  button{font:inherit;cursor:pointer;border:0}
  input{font:inherit}

  /* ---------- Splash ---------- */
  #splash{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a1a1a,#000 70%)}
  .ring{position:relative;width:190px;height:190px;display:grid;place-items:center}
  .ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--orange);
    animation:pulse 2s ease-out forwards;opacity:0}
  .ring::after{animation-delay:.35s}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .ring img{width:150px;height:150px;border-radius:32px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .brand{margin-top:26px;font-size:34px;font-weight:900;letter-spacing:6px;display:flex}
  .brand span{display:inline-block;opacity:0;transform:translateY(16px);animation:rise .5s ease forwards}
  .brand span:nth-child(-n+3){color:var(--orange)}
  .brand span:nth-child(1){animation-delay:.5s}.brand span:nth-child(2){animation-delay:.58s}
  .brand span:nth-child(3){animation-delay:.66s}.brand span:nth-child(4){animation-delay:.74s}
  .brand span:nth-child(5){animation-delay:.82s}.brand span:nth-child(6){animation-delay:.9s}
  .brand span:nth-child(7){animation-delay:.98s}
  @keyframes rise{to{opacity:1;transform:none}}
  .bar{margin-top:30px;width:160px;height:4px;border-radius:4px;background:#222;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--white));animation:fill 2s linear forwards}
  @keyframes fill{to{width:100%}}
  #splashMsg{margin-top:18px;min-height:20px;color:var(--muted);font-size:14px;text-align:center;padding:0 24px}
  #retryBtn{display:none;margin-top:12px;padding:10px 22px;border-radius:12px;background:var(--orange);color:#000;font-weight:700}

  /* ---------- Register ---------- */
  #register{align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 24px;text-align:center}
  .card img{width:84px;height:84px;border-radius:20px}
  .card h1{margin:12px 0 4px;font-size:26px;letter-spacing:3px}
  .card h1 b{color:var(--orange)}
  .card p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .field{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--white);outline:none;font-size:17px;text-align:center}
  .field:focus{border-color:var(--orange)}
  #nameHint{min-height:20px;margin:10px 0 16px;font-size:13px;color:var(--muted)}
  #nameHint.ok{color:var(--ok)} #nameHint.bad{color:var(--danger)}
  .primary{width:100%;padding:15px;border-radius:14px;background:var(--orange);color:#000;font-weight:800;font-size:17px;letter-spacing:1px}
  .primary:disabled{opacity:.35}
  .primary:active:not(:disabled){transform:scale(.98)}
  .authLink{margin-top:16px;color:var(--muted);font-size:14px}
  .textBtn{background:transparent;color:var(--orange);font-weight:800;padding:8px}
  .remember{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:13px;margin:0 0 16px}
  .remember input{accent-color:var(--orange);width:17px;height:17px}
  .authFields{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .lobbyActions{display:flex;align-items:center;gap:6px;margin-left:auto}
  .smallBtn{background:var(--panel2);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}
  .smallBtn.orange{color:var(--orange);border-color:var(--orange)}

  /* ---------- Lobby ---------- */
  header.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top img{width:38px;height:38px;border-radius:10px}
  header.top .t{font-weight:900;letter-spacing:3px;font-size:19px}
  header.top .t b{color:var(--orange)}
  header.top .me{margin-left:auto;font-size:13px;color:var(--muted)}
  header.top .me strong{color:var(--white)}
  #lobby .body{flex:1;overflow:auto;padding:22px 16px}
  .label{color:var(--muted);font-size:12px;letter-spacing:2px;margin:0 4px 12px}
  .roomBtn{width:100%;display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;
    background:linear-gradient(135deg,#1c1c1c,#111);border:2px solid var(--orange);color:var(--white);text-align:left}
  .roomBtn:active{transform:scale(.98)}
  .roomBtn .ic{width:54px;height:54px;border-radius:16px;background:var(--orange);color:#000;display:grid;place-items:center;font-size:26px}
  .roomBtn .nm{font-size:22px;font-weight:800}
  .roomBtn .sub{margin-top:4px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
  .dot.full{background:var(--danger)}
  .roomBtn .go{margin-left:auto;color:var(--orange);font-size:26px}
  .note{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}

  /* ---------- Chat ---------- */
  header.chatTop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .iconBtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);color:var(--white);font-size:20px;display:grid;place-items:center}
  .iconBtn:active{background:#2c2c2c}
  .ct{flex:1;min-width:0}
  .ct .n{font-weight:800;font-size:18px}
  .ct .s{font-size:12px;color:var(--muted)}
  .pill{padding:8px 12px;border-radius:20px;background:var(--panel2);font-size:13px;color:var(--white);display:flex;align-items:center;gap:6px}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:#0e0e0e}
  .sys{align-self:center;font-size:12px;color:var(--muted);padding:4px 12px;background:var(--panel);border-radius:12px}
  .msg{max-width:80%;padding:9px 13px 7px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.35}
  .msg .who{font-size:12px;font-weight:800;color:var(--orange);margin-bottom:2px}
  .msg .tm{font-size:10px;opacity:.6;text-align:right;margin-top:3px}
  .msg.other{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
  .msg.mine{align-self:flex-end;background:var(--orange);color:#000;border-bottom-right-radius:5px}
  .msg.mine .who{display:none}
  form#sendForm{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
  #msgInput{flex:1;padding:13px 16px;border-radius:24px;border:2px solid var(--line);background:var(--panel2);color:var(--white);outline:none;font-size:16px}
  #msgInput:focus{border-color:var(--orange)}
  #sendBtn{width:48px;height:48px;border-radius:50%;background:var(--orange);color:#000;font-size:22px;font-weight:900}

  /* Members sheet */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
  #sheet.open{display:flex}
  #sheet .inner{width:100%;max-height:70dvh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:2px solid var(--orange)}
  #sheet h3{margin:0 0 14px}
  #sheet li{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  #sheet ul{margin:0;padding:0}
  #sheet .av{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;font-weight:900}
  #sheet .you{color:var(--orange);font-size:12px;margin-left:auto}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;border:1px solid var(--orange);
    color:var(--white);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:88%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 1. Splash (2 seconds) -->
<section class="screen active" id="splash">
  <div class="ring"><img src="logo.svg" alt="BUKCHAT logo"></div>
  <div class="brand"><span>B</span><span>U</span><span>K</span><span style="color:#fff">C</span><span style="color:#fff">H</span><span style="color:#fff">A</span><span style="color:#fff">T</span></div>
  <div class="bar"><i></i></div>
  <div id="splashMsg"></div>
  <button id="retryBtn">Retry</button>
</section>

<!-- 2. Login -->
<section class="screen" id="login">
  <div class="card">
    <img src="logo.svg" alt="BUKCHAT logo">
    <h1><b>BUK</b>CHAT</h1>
    <p>Log in with your username and password.</p>
    <div class="authFields">
      <input class="field" id="loginName" maxlength="15" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
      <input class="field" id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <label class="remember"><input id="rememberMe" type="checkbox" checked> Remember me on this device</label>
    <button class="primary" id="loginBtn">LOG IN</button>
    <div class="authLink">New to BUKCHAT? <button class="textBtn" id="showRegisterBtn">Create account</button></div>
  </div>
</section>

<!-- 3. Name registration -->
<section class="screen" id="register">
  <div class="card">
    <img src="logo.svg" alt="BUKCHAT logo">
    <h1><b>BUK</b>CHAT</h1>
    <p>Choose a unique username and password. Usernames cannot be changed.</p>
    <div class="authFields">
      <input class="field" id="nameInput" maxlength="15" placeholder="Choose username" autocomplete="username" autocapitalize="off" spellcheck="false">
      <input class="field" id="passwordInput" type="password" placeholder="Create password (6+ characters)" autocomplete="new-password">
    </div>
    <div id="nameHint">3–15 letters, numbers or _</div>
    <label class="remember"><input id="regRemember" type="checkbox" checked> Remember me on this device</label>
    <button class="primary" id="regBtn" disabled>CREATE ACCOUNT</button>
    <div class="authLink">Already registered? <button class="textBtn" id="showLoginBtn">Log in</button></div>
  </div>
</section>

<!-- 3. Lobby -->
<section class="screen" id="lobby">
  <header class="top">
    <img src="logo.svg" alt=""><div class="t"><b>BUK</b>CHAT</div>
    <div class="me">Hi, <strong id="meName"></strong></div>
    <div class="lobbyActions">
      <button class="smallBtn orange" id="accountBtn" style="display:none">Add password</button>
      <button class="smallBtn" id="logoutBtn">Log out</button>
    </div>
  </header>
  <div class="body">
    <div class="label">CHATROOMS</div>
    <button class="roomBtn" id="roomBtn">
      <div class="ic">💬</div>
      <div>
        <div class="nm">Chatroom1</div>
        <div class="sub"><span class="dot" id="roomDot"></span><span id="roomCount">0 / 50 online</span></div>
      </div>
      <div class="go">›</div>
    </button>
    <div class="note">Maximum 50 members at a time</div>
  </div>
</section>

<!-- 4. Chat -->
<section class="screen" id="chat">
  <header class="chatTop">
    <button class="iconBtn" id="backBtn" aria-label="Leave">‹</button>
    <div class="ct"><div class="n">Chatroom1</div><div class="s" id="chatSub">connecting…</div></div>
    <button class="pill" id="membersBtn">👥 <span id="memCount">0/50</span></button>
  </header>
  <div id="msgs"></div>
  <form id="sendForm" autocomplete="off">
    <input id="msgInput" placeholder="Type a message" maxlength="500" enterkeyhint="send">
    <button id="sendBtn" type="submit" aria-label="Send">➤</button>
  </form>
</section>

<div id="sheet"><div class="inner"><h3>Members online</h3><ul id="memList"></ul></div></div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
